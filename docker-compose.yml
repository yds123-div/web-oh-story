# DeepSFV 本地部署 —— frontend 开发容器（dev 模式，MSW mock，无需后端）
# 用法：docker compose up --build   →  http://localhost:5173
services:
  frontend:
    build: ./frontend
    image: deepsfv-frontend:dev
    container_name: deepsfv-frontend
    ports:
      - "5173:5173"
    environment:
      # Windows bind mount 的 inotify 事件不会穿透，改用轮询监听文件变化
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # 源码挂载：宿主机改代码 → 容器内热更新
      - ./frontend:/app
      # 匿名卷隔离容器内 node_modules，避免被宿主机目录覆盖
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          cpus: "2"      # 2 核
          memory: 4g     # 4G 内存

volumes:
  frontend_node_modules:
